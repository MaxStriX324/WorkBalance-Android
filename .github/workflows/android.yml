name: Android CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test, lint and build GitHub debug APK
        run: ./gradlew testGithubDebugUnitTest lintGithubDebug assembleGithubDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkBalance-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
