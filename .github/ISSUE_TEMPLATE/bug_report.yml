name: Ошибка
description: Сообщить о воспроизводимой проблеме
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Не прикладывайте реальные резервные копии, ФИО, название организации или номера пропусков.
  - type: input
    id: version
    attributes:
      label: Версия приложения и Android
      placeholder: WorkBalance 0.3.0, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Последовательность действий
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемый результат
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактический результат
    validations:
      required: true
